<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Aswin Sreenivas</title>
  <desc id="desc">Data systems, applied AI, and agent tooling with an animated dotted systems orb</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1"/>
    </pattern>
    <style>
      .orbit-a { transform-origin: 930px 151px; animation: spin 24s linear infinite; }
      .orbit-b { transform-origin: 930px 151px; animation: spin-reverse 31s linear infinite; }
      .orbit-c { transform-origin: 930px 151px; animation: spin 38s linear infinite; }
      .core { transform-origin: 930px 151px; animation: breathe 3.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes breathe { 50% { transform: scale(1.14); opacity: .45; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit-a, .orbit-b, .orbit-c, .core { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="22" fill="#0d1117"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)" opacity=".55"/>
  <path d="M0 4a4 4 0 0 1 4-4h1192a4 4 0 0 1 4 4v5H0z" fill="url(#accent)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="54" y="48" width="126" height="26" rx="13" fill="#121d2f" stroke="#1f6feb"/>
    <circle cx="70" cy="61" r="4" fill="#58a6ff"/>
    <text x="82" y="66" fill="#79c0ff" font-size="11" font-weight="700" letter-spacing="1.2">SYSTEMS / LIVE</text>

    <text x="54" y="137" fill="#f0f6fc" font-size="50" font-weight="750" letter-spacing="-1.8">Aswin Sreenivas</text>
    <text x="56" y="176" fill="#8b949e" font-size="19" font-weight="500">Data systems · applied AI · agent tooling</text>
    <text x="56" y="227" fill="#f0f6fc" font-size="14" font-weight="650">HEAD OF DATA &amp; AI, STARHUB</text>
    <text x="56" y="252" fill="#8b949e" font-size="14">Founder, Lumen · AI visibility</text>

    <circle cx="930" cy="151" r="119" fill="#161b22" stroke="#30363d"/>
    <circle cx="930" cy="151" r="99" fill="none" stroke="#30363d" stroke-dasharray="1 10" stroke-linecap="round" stroke-width="3"/>

    <g class="orbit-a">
      <ellipse cx="930" cy="151" rx="151" ry="48" fill="none" stroke="#c9d1d9" stroke-dasharray="1 11" stroke-linecap="round" stroke-width="4" transform="rotate(-12 930 151)"/>
      <circle cx="1076" cy="119" r="5" fill="#58a6ff"/>
    </g>
    <g class="orbit-b">
      <ellipse cx="930" cy="151" rx="151" ry="48" fill="none" stroke="#8b949e" stroke-dasharray="1 12" stroke-linecap="round" stroke-width="4" transform="rotate(48 930 151)"/>
      <circle cx="1000" cy="33" r="5" fill="#bc8cff"/>
    </g>
    <g class="orbit-c">
      <ellipse cx="930" cy="151" rx="151" ry="48" fill="none" stroke="#6e7681" stroke-dasharray="1 13" stroke-linecap="round" stroke-width="4" transform="rotate(108 930 151)"/>
    </g>

    <circle class="core" cx="930" cy="151" r="31" fill="url(#accent)" opacity=".24"/>
    <circle cx="930" cy="151" r="18" fill="url(#accent)"/>
    <circle cx="924" cy="145" r="5" fill="#ffffff" opacity=".78"/>

    <rect x="744" y="67" width="72" height="25" rx="12.5" fill="#121d2f" stroke="#1f6feb"/>
    <text x="760" y="84" fill="#79c0ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">MEASURE</text>
    <rect x="1037" y="53" width="69" height="25" rx="12.5" fill="#21262d" stroke="#30363d"/>
    <text x="1052" y="70" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">REASON</text>
    <rect x="1035" y="226" width="57" height="25" rx="12.5" fill="#21162d" stroke="#8957e5"/>
    <text x="1050" y="243" fill="#d2a8ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">SHIP</text>

    <text x="930" y="294" text-anchor="middle" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" letter-spacing="1.5">THINKING IN SYSTEMS</text>
  </g>
</svg>
