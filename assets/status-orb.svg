<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Building</title>
  <desc id="desc">A monochrome animated orb made from letters and numbers beside the words Building, data, AI, agents</desc>

  <defs>
    <style>
      .orbit-a { transform-origin: 350px 150px; animation: orbit 24s linear infinite; }
      .orbit-b { transform-origin: 350px 150px; animation: orbit-reverse 31s linear infinite; }
      .orbit-c { transform-origin: 350px 150px; animation: orbit 42s linear infinite; }
      .pulse-a { animation: pulse 3.2s ease-in-out infinite; }
      .pulse-b { animation: pulse 4.1s ease-in-out -1.7s infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 50% { opacity: .28; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit-a, .orbit-b, .orbit-c, .pulse-a, .pulse-b { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#090909"/>
  <rect x="185" y="67" width="830" height="166" rx="83" fill="#111111" stroke="#252525"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <g class="orbit-a" fill="#f2f2f2" font-size="9">
      <text x="350" y="91">0</text>
      <text x="383" y="101">A</text>
      <text x="402" y="125">1</text>
      <text x="407" y="157">D</text>
      <text x="395" y="187">7</text>
      <text x="369" y="207">I</text>
      <text x="337" y="209">0</text>
      <text x="309" y="193">L</text>
      <text x="293" y="167">1</text>
      <text x="296" y="133">M</text>
      <text x="316" y="106">8</text>
    </g>

    <g class="orbit-b" fill="#b8b8b8" font-size="8">
      <text x="350" y="106">A</text>
      <text x="375" y="113">0</text>
      <text x="391" y="134">I</text>
      <text x="392" y="160">1</text>
      <text x="379" y="181">X</text>
      <text x="355" y="192">M</text>
      <text x="330" y="185">0</text>
      <text x="312" y="167">D</text>
      <text x="310" y="141">1</text>
      <text x="324" y="118">L</text>
    </g>

    <g class="orbit-c" fill="#707070" font-size="7">
      <text x="348" y="119">1</text>
      <text x="368" y="124">N</text>
      <text x="380" y="141">0</text>
      <text x="379" y="161">A</text>
      <text x="367" y="177">9</text>
      <text x="347" y="182">I</text>
      <text x="329" y="174">0</text>
      <text x="319" y="157">L</text>
      <text x="322" y="137">1</text>
      <text x="334" y="123">M</text>
    </g>

    <g class="pulse-a" fill="#ffffff">
      <text x="350" y="151" font-size="12">AI</text>
      <text x="327" y="146" font-size="6">01</text>
      <text x="372" y="154" font-size="6">10</text>
    </g>

    <g class="pulse-b" fill="#8a8a8a" font-size="6">
      <text x="278" y="117">0</text>
      <text x="286" y="201">A</text>
      <text x="417" y="109">1</text>
      <text x="425" y="194">I</text>
      <text x="267" y="158">D</text>
      <text x="434" y="151">0</text>
      <text x="302" y="89">M</text>
      <text x="400" y="214">1</text>
    </g>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="470" y="148" fill="#dedede" font-size="31" font-weight="450" letter-spacing=".2">Building...</text>
    <text x="472" y="178" fill="#747474" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">DATA / AI / AGENTS</text>
  </g>
</svg>
